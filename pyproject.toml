[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    ".mypy_cache",
    ".ruff_cache",
    "node_modules",
    "dist",
    "build",
]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
]
fixable = ["ALL"]

[tool.ruff.format]
indent-style = "space"
quote-style = "double"