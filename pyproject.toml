[build-system]
requires = [
    "setuptools>=68",
    "wheel",
]
build-backend = "setuptools.build_meta"

[project]
name = "gh-issue-lens"
description = "Find beginner-friendly GitHub issues and export them as JSONL for LLM analysis."
dynamic = [
    "version",
    "readme",
]
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [
    { name = "Mohammad El-Shennawy", email = "mohamedwork216@gmail.com" },
]
keywords = [
    "github",
    "open-source",
    "issues",
    "llm",
    "cli",
    "developer-tools",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Version Control :: Git",
    "Topic :: Utilities",
]
dependencies = [
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "build>=1.2.0",
    "twine>=5.0.0",
    "pytest>=8.0.0",
    "ruff>=0.5.0",
]

[project.scripts]
gh-issue-lens = "gh_issue_lens.cli:main"

[project.urls]
Homepage = "https://github.com/MohamedM216/gh-issue-lens"
Repository = "https://github.com/MohamedM216/gh-issue-lens"
Issues = "https://github.com/MohamedM216/gh-issue-lens/issues"

[tool.setuptools.dynamic]
version = { attr = "gh_issue_lens.__version__" }
readme = { file = "README.md", content-type = "text/markdown" }

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = [
    "src",
]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    ".mypy_cache",
    ".ruff_cache",
    "node_modules",
    "dist",
    "build",
]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
]
fixable = ["ALL"]

[tool.ruff.format]
indent-style = "space"
quote-style = "double"